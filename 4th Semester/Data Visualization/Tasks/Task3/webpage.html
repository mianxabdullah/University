<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Power BI Dashboard</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        color: #fff;
        text-align: center;
    }

    header {
        padding: 30px 20px;
    }

    h1 {
        font-size: 2.5rem;
    }

    .container {
        width: 90%;
        max-width: 1200px;
        margin: auto;
        padding: 20px;
        border-radius: 20px;
        backdrop-filter: blur(15px);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    iframe {
        width: 100%;
        height: 550px;
        border: none;
        border-radius: 15px;
        margin-top: 15px;
    }

    .btn {
        margin-top: 10px;
        padding: 10px 20px;
        border: none;
        border-radius: 25px;
        background: #ffffff;
        color: #333;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #ddd;
        transform: scale(1.05);
    }

    .info {
        margin-top: 10px;
        font-size: 0.9rem;
        opacity: 0.8;
    }
</style>

</head>

<body>

<header>
    <h1>📊 Power BI Dashboard</h1>
</header>

<div class="container">

    <!-- Refresh Button -->
    <button class="btn" onclick="refreshReport()">🔄 Refresh Dashboard</button>

    <div class="info">Click to reload latest data</div>

    <!-- Power BI Report -->
    <iframe id="reportFrame"
    src="https://app.powerbi.com/reportEmbed?reportId=b647185d-9a75-41d0-a0ec-fa301067b760&autoAuth=true&ctid=b0eeb88f-a842-482d-a9c0-d374ec25ff27"
    allowfullscreen="true">
    </iframe>

</div>

<script>
function refreshReport() {
    let frame = document.getElementById("reportFrame");
    frame.src = frame.src; // reload iframe
}
</script>

</body>
</html>
