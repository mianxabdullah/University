<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Power BI Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
    }

    header {
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 1px;
    }

    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      backdrop-filter: blur(15px);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 15px;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      iframe {
        height: 400px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📊 Power BI Interactive Dashboard</h1>
</header>

<div class="container">
  <div class="card">
    <iframe 
      src="https://app.powerbi.com/reportEmbed?reportId=c7fe0791-cfbf-45fc-ad7a-ded27b1f405e&autoAuth=true&ctid=b0eeb88f-a842-482d-a9c0-d374ec25ff27" 
      allowFullScreen="true">
    </iframe>
  </div>
</div>

<footer>
  © 2026 Data Analytics Dashboard | Powered by Power BI
</footer>

</body>
</html>
